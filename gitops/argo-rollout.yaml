apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hardened-app-rollout
  namespace: production
  labels:
    app.kubernetes.io/name: hardened-app
    app.kubernetes.io/part-of: hardened-platform
    app.kubernetes.io/managed-by: gitops
spec:
  replicas: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hardened-app
  strategy:
    canary:
      canaryService: hardened-app-canary
      stableService: hardened-app-stable
      trafficRouting:
        nginx:
          stableIngress: hardened-app-ingress
      analysis:
        templates:
          - templateName: prom-canary-analysis
        args:
          - name: service-name
            value: hardened-app
      steps:
        # Phase 1: 10% Canary traffic slice with 5-minute telemetry soak
        - setWeight: 10
        - pause: { duration: 5m }
        # Phase 2: 30% Canary traffic slice with automated Prometheus analysis
        - setWeight: 30
        - pause: { duration: 3m }
        # Phase 3: 60% Canary traffic slice
        - setWeight: 60
        - pause: { duration: 3m }
        # Automatic promotion to 100% upon passing all analysis iterations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hardened-app
        role: backend
    spec:
      serviceAccountName: hardened-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hardened-app
          image: nginx:1.25.3-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /var/cache/nginx
            - name: run-volume
              mountPath: /var/run
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 64Mi
        - name: cache-volume
          emptyDir:
            sizeLimit: 64Mi
        - name: run-volume
          emptyDir:
            sizeLimit: 16Mi
