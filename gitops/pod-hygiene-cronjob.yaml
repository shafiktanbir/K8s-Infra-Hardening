apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-hygiene-audit
  namespace: kube-system
  labels:
    app.kubernetes.io/name: pod-hygiene-audit
    app.kubernetes.io/part-of: hardened-platform
spec:
  schedule: "*/15 * * * *" # Runs every 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pod-hygiene-audit
        spec:
          serviceAccountName: pod-hygiene-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auditor
              image: ghcr.io/shafiktanbir/pod-hygiene-cli:v1.0.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 32Mi
